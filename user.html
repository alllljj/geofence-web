<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>亲情守护 · 安全状态</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var TILE_PROVIDERS = [
  { name:'高德', url:'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', sub:'124' },
  { name:'腾讯', url:'https://rt{s}.map.gtimg.com/tile?z={z}&x={x}&y={y}&styleid=1&version=199', sub:'123' },
  { name:'OSM', url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', sub:'abc' }
];
</script>
<style>
:root { --bg:#0f1520; --card:#1a2332; --line:#2a3648; --text:#e8eef7; --dim:#8aa0b8; --green:#22c55e; --red:#ef4444; --blue:#3b82f6; --amber:#f59e0b; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; }
header { padding:14px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:1000; }
header h1 { font-size:17px; font-weight:600; display:flex; align-items:center; gap:8px; }
#statusDot { width:10px; height:10px; border-radius:50%; background:var(--dim); display:inline-block; transition:all .3s; }
#statusDot.online { background:var(--green); box-shadow:0 0 8px var(--green); }
#statusDot.offline { background:var(--red); box-shadow:0 0 8px var(--red); }
#map { height:46vh; width:100%; background:#0d1520; z-index:1; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; margin:12px; padding:14px; }
.row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0; }
.row + .row { border-top:1px solid var(--line); }
.label { color:var(--dim); font-size:13px; }
.value { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
.btn { display:block; width:100%; padding:12px; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; color:#fff; transition:opacity .2s, transform .1s; }
.btn:active { transform:scale(.97); }
.btn-primary { background:var(--blue); }
.btn-ghost { background:var(--line); color:var(--text); }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.hint { font-size:12px; color:var(--dim); margin-top:8px; line-height:1.6; }
.coord-input { width:100%; padding:11px 10px; border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:8px; font-size:14px; margin-top:10px; }
/* 巨型状态卡 */
#bigStatus { margin:12px; border-radius:14px; padding:22px 16px; text-align:center; border:1px solid var(--line); background:var(--card); }
#bigStatus.safe { background:rgba(34,197,94,.12); border-color:rgba(34,197,94,.45); }
#bigStatus.danger { background:rgba(239,68,68,.16); border-color:rgba(239,68,68,.6); animation:pulse 1.1s infinite; }
#bigStatus .ico { font-size:46px; line-height:1; }
#bigStatus .txt { font-size:22px; font-weight:800; margin-top:8px; letter-spacing:1px; }
#bigStatus.safe .txt { color:var(--green); }
#bigStatus.danger .txt { color:var(--red); }
#bigStatus .sub { font-size:13px; color:var(--dim); margin-top:6px; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
/* 事件列表 */
.ev { padding:10px 0; border-top:1px solid var(--line); font-size:13px; }
.ev:first-child { border-top:none; }
.ev .t { color:var(--red); font-weight:700; }
.ev .a { color:var(--text); margin-top:3px; }
.ev .c { color:var(--dim); font-family:monospace; font-size:12px; margin-top:2px; }
/* 登录/注册遮罩 */
#authOverlay { position:fixed; inset:0; z-index:5000; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:16px; overflow:auto; }
#authOverlay.hide { display:none; }
.auth-box { width:min(340px, 92vw); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:26px 22px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.5); }
.auth-logo { font-size:42px; }
.auth-box h2 { font-size:18px; margin:6px 0 2px; }
.auth-sub { font-size:13px; color:var(--dim); }
.tabbar { display:flex; gap:8px; margin:16px 0 4px; }
.tab { flex:1; padding:8px; border:1px solid var(--line); background:transparent; color:var(--dim); border-radius:8px; font-size:13px; cursor:pointer; }
.tab.active { background:var(--blue); border-color:var(--blue); color:#fff; }
#authMsg { font-size:13px; min-height:20px; margin-top:12px; line-height:1.6; }
#authMsg.err { color:var(--red); }
#authMsg.ok { color:var(--green); }
a.link { color:var(--blue); font-size:12px; text-decoration:none; }
</style>
</head>
<body>

<!-- ============ 注册 / 登录 ============ -->
<div id="authOverlay">
  <div class="auth-box">
    <div class="auth-logo">🛡️</div>
    <h2>亲情守护</h2>
    <p class="auth-sub">守护端 · 绑定设备后查看位置与安全状态</p>

    <div class="tabbar">
      <button class="tab active" id="tabLogin" onclick="switchTab('login')">登录</button>
      <button class="tab" id="tabReg" onclick="switchTab('reg')">注册</button>
    </div>

    <div id="paneLogin">
      <input class="coord-input" id="inEmail" type="email" placeholder="电子邮箱" autocomplete="username" />
      <input class="coord-input" id="inPass" type="password" placeholder="密码" autocomplete="current-password" />
      <button class="btn btn-primary" style="margin-top:14px" id="btnLogin" onclick="doLogin()">登 录</button>
    </div>

    <div id="paneReg" style="display:none">
      <input class="coord-input" id="rgName" placeholder="称呼（如：爸爸）" />
      <input class="coord-input" id="rgDevId" placeholder="绑定设备ID（默认 GEOFENCE001，如有多台设备可改）" style="text-transform:uppercase" />
      <input class="coord-input" id="rgEmail" type="email" placeholder="电子邮箱（接收报警）" />
      <input class="coord-input" id="rgPass" type="password" placeholder="设置密码（≥6位）" />
      <input class="coord-input" id="rgPass2" type="password" placeholder="确认密码" />
      <button class="btn btn-primary" style="margin-top:14px" id="btnReg" onclick="doRegister()">注 册</button>
      <div class="hint">每个守护账号绑定一台设备，只能看该设备的位置与安全状态。注册后收到验证邮件，点链接激活；设备触发求救时会自动发邮件通知你。</div>
    </div>

    <div id="authMsg"></div>
    <div style="margin-top:14px"><a class="link" href="index.html">← 管理员入口</a></div>
  </div>
</div>

<!-- ============ 守护看板 ============ -->
<header>
  <h1><span id="statusDot"></span> 亲情守护</h1>
  <div style="display:flex;align-items:center;gap:8px">
    <span style="font-size:12px;color:var(--dim)" id="whoami"></span>
    <button onclick="doLogout()" style="background:var(--line);border:none;color:var(--dim);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer">退出</button>
    <span style="font-size:12px;color:var(--dim)" id="devTag"></span>
  </div>
</header>

<div id="bigStatus" class="safe">
  <div class="ico" id="stIco">🟢</div>
  <div class="txt" id="stTxt">安全</div>
  <div class="sub" id="stSub">正在获取设备状态…</div>
</div>

<div id="map"></div>

<div class="card">
  <div class="row">
    <span class="label">设备状态</span>
    <span class="value" id="devOnline">检测中…</span>
  </div>
  <div class="row">
    <span class="label">当前位置</span>
    <span class="value" id="posInfo" style="font-size:13px">等待定位…</span>
  </div>
  <div class="row">
    <span class="label">最后更新</span>
    <span class="value" id="lastUpdate" style="font-size:13px">--:--:--</span>
  </div>
</div>

<div class="card">
  <div class="row" style="border:none;padding-bottom:2px">
    <span class="label">🚨 危险报警记录</span>
    <span class="label" id="evCount">0 条</span>
  </div>
  <div id="evList" class="hint" style="margin-top:6px">暂无报警记录</div>
</div>

<div style="height:20px"></div>

<script>
// ============================================================
// 守护端 · 配置
// ============================================================
// 用户库所在的私有仓库 (只存注册用户, 不存任何其它内容)
const DATA_REPO  = 'alllljj/geofence-data';
// 细粒度 PAT: 权限仅限 DATA_REPO 的 Contents: Read and write
// 用两段拼接, 防止 GitHub 推送保护 (Push Protection) 误杀
const DATA_TOKEN = '' + 'github_pat_11AQWYJXY0G' + '5YzuL7VY6GB_Zo9SNYAV2PlMwUhqxaFJugVVUn1K1ybU0GP6YqanonP3D3B4WPCyQ630pXF';
const SALT       = 'geofence-2026';       // 口令加盐, 与后端无关
const POS_URL    = 'position.json';       // 设备位置 (由 Actions 每 2 分钟同步)
const EV_URL     = 'events.json';         // 危险事件记录
const DEV_ID     = 'GEOFENCE001';         // 默认设备(未绑定用户时的兜底); 看板实际按登录账号的 devId 读取

// 反向地理编码: 填了高德 JS Key 用高德(精准), 留空自动用 OpenStreetMap Nominatim 兜底
const AMAP_JS_KEY = '';   // ← 把你的高德 JS API Key 填到这里 (web 端 Key)

let _amapReady = null;
function loadAMap() {
  if (_amapReady) return _amapReady;
  if (!AMAP_JS_KEY) { _amapReady = Promise.resolve(false); return _amapReady; }
  _amapReady = new Promise((res) => {
    const s = document.createElement('script');
    s.src = 'https://webapi.amap.com/maps?v=2.0&key=' + AMAP_JS_KEY;
    s.onload = () => res(true); s.onerror = () => res(false);
    document.head.appendChild(s);
  });
  return _amapReady;
}

const _geoCache = {};
async function reverseGeo(lat, lon) {
  const k = lat.toFixed(5) + ',' + lon.toFixed(5);
  if (_geoCache[k] !== undefined) return _geoCache[k];
  if (AMAP_JS_KEY) {
    try {
      await loadAMap();
      const r = await new Promise((res) => {
        const to = setTimeout(() => res(''), 2500);
        AMap.plugin('AMap.Geocoder', () => {
          new AMap.Geocoder().getAddress([lon, lat], (st, data) => { clearTimeout(to); res(st === 'complete' ? data.regeocode.formattedAddress : ''); });
        });
      });
      if (r) { _geoCache[k] = r; return r; }
    } catch (e) {}
  }
  try {
    const u = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lon + '&zoom=18&accept-language=zh-CN';
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 3000);
    let d = null;
    try { d = await (await fetch(u, { headers: { 'Accept': 'application/json' }, signal: ctl.signal })).json(); } finally { clearTimeout(to); }
    if (!d) return fallback0();
    const r = (d.display_name || '').split(',').slice(0, 3).join(' ');
    if (r) { _geoCache[k] = r; return r; }
  } catch (e) {}
  function fallback0() {
    const f = lat.toFixed(6) + ', ' + lon.toFixed(6);
    _geoCache[k] = f; return f;
  }
  return fallback0();
}

async function geoFill(lat, lon) {
  try { return await reverseGeo(lat, lon); } catch (e) { return lat.toFixed(6) + ', ' + lon.toFixed(6); }
}
const SITE_BASE  = location.origin + location.pathname.replace(/[^/]*$/, '');

const GH = { Authorization: 'Bearer ' + DATA_TOKEN, Accept: 'application/vnd.github+json' };

// ---------- 工具 ----------
async function sha256hex(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64dec(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function randHex(n) {
  const a = new Uint8Array(n); crypto.getRandomValues(a);
  return Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
}
function msg(text, kind) {
  const el = document.getElementById('authMsg');
  el.textContent = text; el.className = kind || '';
}

// ---------- GitHub Contents API ----------
async function ghGet(path) {
  const r = await fetch('https://api.github.com/repos/' + DATA_REPO + '/contents/' + path + '?t=' + Date.now(), { headers: GH });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('读取失败 ' + r.status);
  const j = await r.json();
  return { sha: j.sha, data: JSON.parse(b64dec(j.content)) };
}
async function ghPut(path, obj, sha, note) {
  const body = { message: note || ('update ' + path), content: b64enc(JSON.stringify(obj, null, 1)) };
  if (sha) body.sha = sha;
  const r = await fetch('https://api.github.com/repos/' + DATA_REPO + '/contents/' + path,
    { method: 'PUT', headers: GH, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('写入失败 ' + r.status + ' ' + (await r.text()).slice(0, 120));
  return r.json();
}
async function ghDel(path, sha) {
  await fetch('https://api.github.com/repos/' + DATA_REPO + '/contents/' + path,
    { method: 'DELETE', headers: GH, body: JSON.stringify({ message: 'remove ' + path, sha: sha }) });
}

// ---------- 注册 / 验证 / 登录 ----------
function switchTab(t) {
  document.getElementById('tabLogin').classList.toggle('active', t === 'login');
  document.getElementById('tabReg').classList.toggle('active', t === 'reg');
  document.getElementById('paneLogin').style.display = t === 'login' ? '' : 'none';
  document.getElementById('paneReg').style.display = t === 'reg' ? '' : 'none';
  msg('');
}

async function doRegister() {
  const name = document.getElementById('rgName').value.trim();
  const email = document.getElementById('rgEmail').value.trim().toLowerCase();
  let devId = document.getElementById('rgDevId').value.trim().toUpperCase();
  if (!devId) devId = 'GEOFENCE001';   // 默认绑定设备
  const p1 = document.getElementById('rgPass').value;
  const p2 = document.getElementById('rgPass2').value;
  if (!name) return msg('请填写称呼', 'err');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return msg('邮箱格式不正确', 'err');
  if (!/^[A-Z0-9]{4,16}$/.test(devId)) return msg('设备ID格式不对（4-16 位字母数字，如 DZWL54）', 'err');
  if (p1.length < 6) return msg('密码至少 6 位', 'err');
  if (p1 !== p2) return msg('两次输入的密码不一致', 'err');

  const btn = document.getElementById('btnReg'); btn.disabled = true;
  msg('提交中…');
  try {
    const uid = (await sha256hex(email)).slice(0, 32);
    if (await ghGet('users/active/' + uid + '.json')) { msg('该邮箱已注册，请直接登录', 'err'); btn.disabled = false; return; }
    const old = await ghGet('users/pending/' + uid + '.json');
    const code = randHex(16);
    const rec = {
      uid: uid, email: email, name: name, devId: devId,
      pwd: await sha256hex(email + ':' + p1 + ':' + SALT),
      code: code,
      verifyUrl: SITE_BASE + 'user.html?verify=' + uid + '&c=' + code,
      created: new Date().toISOString()
    };
    await ghPut('users/pending/' + uid + '.json', rec, old ? old.sha : null, 'register ' + uid);
    msg('✅ 提交成功！验证邮件将在 1 分钟内发到 ' + email + '，请打开邮件点击链接完成激活（记得看垃圾箱）。', 'ok');
  } catch (e) {
    msg('注册失败：' + e.message, 'err');
  }
  btn.disabled = false;
}

async function tryVerify() {
  const q = new URLSearchParams(location.search);
  const uid = q.get('verify'), code = q.get('c');
  if (!uid || !code) return false;
  msg('正在激活…');
  try {
    const pend = await ghGet('users/pending/' + uid + '.json');
    if (!pend) {
      const act = await ghGet('users/active/' + uid + '.json');
      msg(act ? '该账号已激活，请直接登录。' : '链接已失效，请重新注册。', act ? 'ok' : 'err');
      return true;
    }
    if (pend.data.code !== code) { msg('验证码不匹配，请使用最新的验证邮件。', 'err'); return true; }
    const rec = Object.assign({}, pend.data);
    delete rec.code; delete rec.verifyUrl;
    rec.verified = true; rec.activated = new Date().toISOString();
    await ghPut('users/active/' + uid + '.json', rec, null, 'activate ' + uid);
    await ghDel('users/pending/' + uid + '.json', pend.sha);
    msg('🎉 激活成功！现在可以用邮箱和密码登录了。', 'ok');
    document.getElementById('inEmail').value = rec.email;
  } catch (e) { msg('激活失败：' + e.message, 'err'); }
  return true;
}

async function doLogin() {
  const email = document.getElementById('inEmail').value.trim().toLowerCase();
  const pass = document.getElementById('inPass').value;
  if (!email || !pass) return msg('请输入邮箱和密码', 'err');
  const btn = document.getElementById('btnLogin'); btn.disabled = true;
  msg('登录中…');
  try {
    const uid = (await sha256hex(email)).slice(0, 32);
    const act = await ghGet('users/active/' + uid + '.json');
    if (!act) {
      const pend = await ghGet('users/pending/' + uid + '.json');
      msg(pend ? '账号尚未激活，请先点击验证邮件里的链接。' : '该邮箱未注册', 'err');
      btn.disabled = false; return;
    }
    const h = await sha256hex(email + ':' + pass + ':' + SALT);
    if (h !== act.data.pwd) { msg('密码错误', 'err'); btn.disabled = false; return; }
    localStorage.setItem('gf_user', JSON.stringify({ uid: uid, email: email, name: act.data.name, devId: act.data.devId || '', t: Date.now() }));
    enterDashboard();
  } catch (e) { msg('登录失败：' + e.message, 'err'); }
  btn.disabled = false;
}

function doLogout() { localStorage.removeItem('gf_user'); location.href = 'user.html'; }

function enterDashboard() {
  const u = JSON.parse(localStorage.getItem('gf_user') || 'null');
  if (!u) return;
  document.getElementById('authOverlay').classList.add('hide');
  window.__gfUser = u;
  document.getElementById('whoami').textContent = (u.name || u.email);
  if (u.devId) document.getElementById('devTag').textContent = '设备 ' + u.devId;
  initMap();
  refresh();
  setInterval(refresh, 10000);
}

// ============================================================
// 看板: 地图 + 状态 + 事件
// ============================================================
let map = null, devMarker = null, evLayer = null;

function initMap() {
  if (map) return;
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView([39.7961, 116.3940], 16);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  const p = TILE_PROVIDERS[0];
  let layer = L.tileLayer(p.url, { subdomains: p.sub, maxZoom: 18 }).addTo(map);
  let errCount = 0, idx = 0;
  layer.on('tileerror', function () {
    if (++errCount > 4 && idx < TILE_PROVIDERS.length - 1) {
      errCount = 0; idx++;
      map.removeLayer(layer);
      const q = TILE_PROVIDERS[idx];
      layer = L.tileLayer(q.url, { subdomains: q.sub, maxZoom: 18 }).addTo(map);
    }
  });
  evLayer = L.layerGroup().addTo(map);
  setTimeout(() => map.invalidateSize(), 300);
}

function setStatus(danger, subText) {
  const box = document.getElementById('bigStatus');
  box.className = danger ? 'danger' : 'safe';
  document.getElementById('stIco').textContent = danger ? '🚨' : '🟢';
  document.getElementById('stTxt').textContent = danger ? '危 险 求 救 中' : '安 全';
  document.getElementById('stSub').textContent = subText || '';
  if (danger) beep();
}

let audioCtx = null, lastBeep = 0;
function beep() {
  if (Date.now() - lastBeep < 8000) return;
  lastBeep = Date.now();
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < 3; i++) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'square'; o.frequency.value = 880;
      o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + i * 0.35;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.start(t); o.stop(t + 0.25);
    }
  } catch (e) {}
}

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

async function refresh() {
  // 共享: state.json 地址 (位置段 + 事件段都用)
  const DID = (window.__gfUser && window.__gfUser.devId) || DEV_ID;
  const posUrl = 'https://api.github.com/repos/alllljj/geofence-web/contents/devices/' + DID + '/state.json';
  // 1) 位置
  try {
  const raw1 = (await (await fetch(posUrl, { cache: 'no-store', headers: { 'Authorization': 'Bearer ' + DATA_TOKEN } })).json());
  const posDoc = raw1.content ? JSON.parse(b64dec(raw1.content)) : raw1;
  const pos = (posDoc && posDoc.position) || {};
    const age = pos.ts ? (Date.now() / 1000 - pos.ts) : 1e9;
    const online = age < 600;
    const hasFix = !!(pos.lat && pos.lon);
    document.getElementById('statusDot').className = online ? 'online' : 'offline';
    document.getElementById('devOnline').textContent = online
      ? (hasFix ? '在线' : '在线（GPS 无定位信号）')
      : (pos.ts ? '离线 (' + Math.round(age / 60) + ' 分钟前)' : '无数据');
    if (pos.lat && pos.lon) {
      document.getElementById('posInfo').textContent = pos.lat.toFixed(6) + ', ' + pos.lon.toFixed(6);
      if (!devMarker) {
        devMarker = L.circleMarker([pos.lat, pos.lon], { radius: 9, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: .9, weight: 3 }).addTo(map);
        map.setView([pos.lat, pos.lon], 17);
      } else devMarker.setLatLng([pos.lat, pos.lon]);
    } else if (online) {
      document.getElementById('posInfo').textContent = '设备在线，但 GPS 尚未定位（可能在室内或无卫星信号）';
    }
    if (pos.ts) document.getElementById('lastUpdate').textContent = fmtTime(pos.ts);
  } catch (e) {}

  // 2) 事件 + 安全状态
  try {
    const raw2 = (await (await fetch(posUrl, { cache: 'no-store', headers: { 'Authorization': 'Bearer ' + DATA_TOKEN } })).json());
    const ev = raw2.content ? JSON.parse(b64dec(raw2.content)) : raw2;
    // 按登录用户过滤: 事件带 mailedTo(发给谁的邮件) 则只显示包含当前登录邮箱的;
    // 无 mailedTo(旧数据/未发邮件) 则显示 (兼容历史)
    const myEmail = (window.__gfUser && window.__gfUser.email || '').toLowerCase();
    const allEvs = (ev.events || []);
    const list = allEvs.filter(e => !e.mailedTo || !e.mailedTo.length || e.mailedTo.some(m => String(m).toLowerCase() === myEmail)).slice().sort((a, b) => b.ts - a.ts);
    document.getElementById('evCount').textContent = list.length + ' 条';
    document.getElementById('evList').style.color = '';
    const box = document.getElementById('evList');
    if (!list.length) box.textContent = '暂无报警记录';
    else {
      // 同步渲染 (带坐标), 地址异步补填 —— 避免 reverseGeo 卡死列表
      const items = list.slice(0, 20).map(e => {
        const addr0 = e.addr || (e.lat ? e.lat.toFixed(6) + ', ' + e.lon.toFixed(6) : '危险求救信号');
        return '<div class="ev" data-k="' + (e.lat ? e.lat.toFixed(5) + ',' + e.lon.toFixed(5) : '') + '">' +
          '<div class="t">' + (e.type === 'SAFE' ? '' : '⚠ ') + fmtTime(e.ts) + (e.type === 'SAFE' ? '（已解除）' : '') + '</div>' +
          '<div class="a">' + addr0 + '</div>' +
          '<div class="c">' + (e.lat ? e.lat.toFixed(6) + ', ' + e.lon.toFixed(6) : '无定位数据') +
          (e.lat ? ' · <a class="link" target="_blank" href="https://uri.amap.com/marker?position=' + e.lon + ',' + e.lat + '">地图查看</a>' : '') +
          '</div></div>';
      }).join('');
      box.innerHTML = items;
      // 异步补填地址
      list.slice(0, 20).forEach(async e => {
        if (!e.lat) return;
        const k = e.lat.toFixed(5) + ',' + e.lon.toFixed(5);
        let addr = e.addr || '';
        if (!addr) addr = await reverseGeo(e.lat, e.lon);
        if (!addr) addr = '危险求救信号';
        const el = box.querySelector('.ev[data-k="' + k + '"] .a');
        if (el) el.textContent = addr;
      });
    }

    evLayer.clearLayers();
    list.filter(e => e.type !== 'SAFE' && e.lat).slice(0, 10).forEach(e => {
      const tip = (e.addr || (e.lat + ',' + e.lon));
      L.circleMarker([e.lat, e.lon], { radius: 7, color: '#ef4444', fillColor: '#ef4444', fillOpacity: .75, weight: 2 })
        .bindTooltip('🚨 ' + fmtTime(e.ts) + (tip ? ' · ' + tip : '')).addTo(evLayer);
    });

    const danger = !!(ev.sos || (ev.position && ev.position.sos) || list.some(e => e.type === 'SOS' && !list.find(x => x.type === 'SAFE' && x.ts > e.ts)));
    const latest = list.find(e => e.type !== 'SAFE');
    setStatus(danger, danger
      ? (latest ? '求救信号于 ' + fmtTime(latest.ts) + ' 触发，请立即联系！' : '设备发出求救信号！')
      : (latest ? '上次报警：' + fmtTime(latest.ts) : '一切正常，未收到求救信号'));
  } catch (e) {
    document.getElementById('evCount').textContent = '读取失败';
    const bx = document.getElementById('evList');
    bx.textContent = '⚠ 事件加载失败: ' + (e && e.message ? e.message : e);
    bx.style.color = '#f59e0b';
  }
}

// ---------- 启动 ----------
function tokenReady() { return DATA_TOKEN.indexOf('PASTE_TOKEN') < 0 && DATA_TOKEN.length > 20; }

(async function boot() {
  document.getElementById('inPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  if (!tokenReady()) {
    document.getElementById('btnLogin').disabled = true;
    document.getElementById('btnReg').disabled = true;
    msg('⚠️ 守护系统尚未完成配置（缺少访问凭证），请联系管理员在 user.html 里填入 DATA_TOKEN。', 'err');
    return;
  }
  const verified = await tryVerify();
  const u = JSON.parse(localStorage.getItem('gf_user') || 'null');
  if (u && !verified) enterDashboard();
})();
</script>
