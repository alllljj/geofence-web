<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>电子围栏 · 远程监控</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 地图瓦片源: 国内可访问的备选 (高德/腾讯/天地图), 依次尝试
var TILE_PROVIDERS = [
  { name:'高德', url:'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', sub:'124' },
  { name:'腾讯', url:'https://rt{s}.map.gtimg.com/tile?z={z}&x={x}&y={y}&styleid=1&version=199', sub:'123' },
  { name:'OSM', url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', sub:'abc' }
];
</script>
<style>
:root { --bg:#0f1520; --card:#1a2332; --line:#2a3648; --text:#e8eef7; --dim:#8aa0b8; --green:#22c55e; --red:#ef4444; --blue:#3b82f6; --amber:#f59e0b; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; }
header { padding:14px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:1000; }
header h1 { font-size:17px; font-weight:600; display:flex; align-items:center; gap:8px; }
#statusDot { width:10px; height:10px; border-radius:50%; background:var(--dim); display:inline-block; transition:all .3s; }
#statusDot.online { background:var(--green); box-shadow:0 0 8px var(--green); }
#statusDot.offline { background:var(--red); box-shadow:0 0 8px var(--red); }
#map { height:52vh; width:100%; background:#0d1520; z-index:1; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; margin:12px; padding:14px; }
.row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0; }
.row + .row { border-top:1px solid var(--line); }
.label { color:var(--dim); font-size:13px; }
.value { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
#posInfo { font-size:13px; color:var(--dim); line-height:1.7; }
#fenceStatus { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:20px; font-size:14px; font-weight:600; }
#fenceStatus.in { background:rgba(239,68,68,.15); color:var(--red); }
#fenceStatus.out { background:rgba(34,197,94,.12); color:var(--green); }
#fenceStatus.nofence { background:rgba(139,160,184,.12); color:var(--dim); }
.alert-banner { display:none; background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.4); color:var(--red); text-align:center; padding:10px; font-weight:700; font-size:15px; border-radius:10px; margin:12px; animation:pulse 1.2s infinite; }
.alert-banner.show { display:block; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
.btn { display:block; width:100%; padding:12px; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; color:#fff; transition:opacity .2s, transform .1s; }
.btn:active { transform:scale(.97); }
.btn-primary { background:var(--blue); }
.btn-danger { background:var(--red); }
.btn-ghost { background:var(--line); color:var(--text); }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.hint { font-size:12px; color:var(--dim); margin-top:8px; line-height:1.6; }
#toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(100px); background:#fff; color:#111; padding:10px 18px; border-radius:8px; font-size:14px; font-weight:600; transition:transform .3s; z-index:2000; box-shadow:0 4px 20px rgba(0,0,0,.4); }
#toast.show { transform:translateX(-50%) translateY(0); }
.mode-bar { display:flex; gap:8px; margin-bottom:10px; }
.mode-btn { flex:1; padding:8px; border:1px solid var(--line); background:transparent; color:var(--dim); border-radius:8px; font-size:13px; cursor:pointer; }
.mode-btn.active { background:var(--blue); border-color:var(--blue); color:#fff; }
.coord-input { width:100%; padding:9px 10px; border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:8px; font-size:13px; margin-top:8px; font-family:monospace; }
/* 登录页 */
#loginOverlay { position:fixed; inset:0; z-index:5000; background:var(--bg); display:none; align-items:center; justify-content:center; }
#loginOverlay.show { display:flex; }
.login-box { width:min(320px, 88vw); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 22px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.5); }
.login-logo { font-size:44px; margin-bottom:8px; }
.login-box h2 { font-size:18px; margin-bottom:4px; }
.login-sub { font-size:13px; color:var(--dim); margin-bottom:6px; }
#loginErr { color:var(--red); font-size:13px; min-height:18px; margin-top:10px; }
</style>
</head>
<body>

<!-- ================= 登录页 (未登录时显示) ================= -->
<div id="loginOverlay">
  <div class="login-box">
    <div class="login-logo">🛰️</div>
    <h2>电子围栏 · 远程监控</h2>
    <p class="login-sub">请登录后访问</p>
    <input class="coord-input" id="loginUser" placeholder="账号" autocomplete="username" style="margin-top:16px" />
    <input class="coord-input" id="loginPass" type="password" placeholder="密码" autocomplete="current-password" style="margin-top:10px" />
    <button class="btn btn-primary" style="margin-top:16px" onclick="doLogin()">登 录</button>
    <div class="hint" style="text-align:center" id="loginErr"></div>
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
      <a href="user.html" style="color:var(--blue);font-size:13px;text-decoration:none">🛡️ 家属入口 · 邮箱注册 / 登录 →</a>
      <div class="hint" style="text-align:center;margin-top:4px">普通用户仅可查看定位与安全状态</div>
    </div>
  </div>
</div>

<header>
  <h1><span id="statusDot"></span> 电子围栏 · 远程监控</h1>
  <div style="display:flex;align-items:center;gap:8px">
    <span style="font-size:12px;color:var(--dim)" id="lastUpdate">--:--:--</span>
    <button onclick="doLogout()" style="background:var(--line);border:none;color:var(--dim);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer">退出</button>
  </div>
</header>

<div class="alert-banner" id="alertBanner">🚨 设备已进入危险区！</div>

<div id="map"></div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <span class="label">📷 现场画面</span>
    <span class="value" style="font-size:12px;color:var(--dim)" id="camTime"></span>
  </div>
  <div style="position:relative;margin-top:8px">
    <img id="camImg" alt="现场画面" style="width:100%;max-height:220px;border-radius:10px;background:#000;display:block;min-height:100px;object-fit:contain" />
    <div id="camLoading" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px">画面加载中…</div>
  </div>
  <div class="hint" style="text-align:center">设备定时抓拍上传</div>
</div>

<div class="card">
  <div class="row">
    <span class="label">设备状态</span>
    <span class="value" id="devOnline">检测中…</span>
  </div>
  <div class="row">
    <span class="label">围栏状态</span>
    <span id="fenceStatus" class="nofence">未设置围栏</span>
  </div>
  <div class="row">
    <span class="label">当前位置</span>
    <span class="value" id="posInfo">等待定位…</span>
  </div>
  <div class="row">
    <span class="label">距围栏边缘</span>
    <span class="value" id="distInfo">--</span>
  </div>
</div>

<div class="card">
  <div class="mode-bar">
    <button class="mode-btn" id="modeDraw" onclick="setMode('draw')">✏️ 画围栏</button>
    <button class="mode-btn" id="modeEdit" onclick="setMode('edit')">📋 手动输入</button>
    <button class="mode-btn" id="modeView" onclick="setMode('view')">👁 查看</button>
  </div>
  <div id="manualBox" style="display:none">
    <input class="coord-input" id="manualCoords" placeholder="示例: 39.7961,116.3940;39.7965,116.3940;39.7965,116.3945;39.7961,116.3945" />
    <div class="hint">格式：纬度,经度;纬度,经度;… （至少 3 个点，分号分隔）</div>
    <button class="btn btn-primary" style="margin-top:10px" onclick="sendManualFence()">下发围栏</button>
  </div>
  <div id="drawBox" style="display:none">
    <div class="hint">在地图上依次点击添加顶点，画完点击「完成」下发。点击「撤销」删除最后一点。</div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-ghost" onclick="undoPoint()">↩️ 撤销</button>
      <button class="btn btn-primary" onclick="finishDraw()">✅ 完成下发</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-danger" onclick="clearFence()">🗑 清除围栏</button>
    </div>
  </div>
  <div id="viewBox" class="hint" style="margin-top:0">
    当前围栏：<span id="fenceCount">0</span> 个顶点
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-danger" onclick="clearFence()">🗑 清除围栏</button>
    </div>
  </div>
</div>

<div class="card">
  <div class="row" style="border:none;padding-bottom:2px">
    <span class="label">🚨 危险报警记录（求救开关）</span>
    <span class="label" id="evCount">0 条</span>
  </div>
  <div id="evList" class="hint" style="margin-top:6px">暂无报警记录</div>
</div>

<div id="toast"></div>

<script>
// ================= 登录验证 =================
// 简单前端登录: 账号/密码校验 + sessionStorage 会话标记
// ⚠️ 注意: 纯前端登录仅作访问门槛, 非高安全方案 (源码可见凭据)
const AUTH_USER = 'DZWL54';
const AUTH_PASS = 'dzwl54';
function authOk() { return sessionStorage.getItem('gf_auth') === '1'; }
function requireAuth() {
  const ov = document.getElementById('loginOverlay');
  if (!authOk()) {
    ov.classList.add('show');
    return false;
  }
  ov.classList.remove('show');
  return true;
}
async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  if (u === AUTH_USER && p === AUTH_PASS) {
    sessionStorage.setItem('gf_auth', '1');
    err.textContent = '';
    document.getElementById('loginOverlay').classList.remove('show');
    toast('欢迎回来');
    init();
  } else {
    err.textContent = '账号或密码错误';
  }
}
function doLogout() {
  sessionStorage.removeItem('gf_auth');
  location.reload();
}
// 回车提交
function loginKey(e) { if (e.key === 'Enter') doLogin(); }
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('loginPass').addEventListener('keydown', loginKey);
  document.getElementById('loginUser').addEventListener('keydown', loginKey);
  requireAuth();  // 未登录显示登录层, 已登录则隐藏
});

// ================= 配置 =================
// ⚠️ 部署前修改: 你的巴法云 UID 和主题
const BEMFA_UID = '050042db7c93475090e07b207e55d01a';
const TOPIC = 'geofence001';
const API = 'https://apis.bemfa.com/va';
// 位置数据源:
//   优先级1: Cloudflare Worker (需自行部署 worker.js, 把这里改成你的 Worker 地址)
//   优先级2: 本地中转脚本写入的 position.json (GitHub Pages 同目录)
const WORKER_URL = 'https://geofence-sync.geofence-relay.workers.dev';   // ⚠️ 填入你的 Cloudflare Worker 地址 (如 https://geofence-relay.xxx.workers.dev), 留空则用 position.json
const POS_URL = 'position.json';

// 家属账号库访问 (geofence-data 私有仓库): 用于报警记录显示该设备的守护联系邮箱
// 与 user.html 同一细粒度 PAT (仅授权 Contents 读写); 两段拼接防 GitHub 推送保护
const DATA_TOKEN = '' + 'github_pat_11AQWYJXY0G' + '5YzuL7VY6GB_Zo9SNYAV2PlMwUhqxaFJugVVUn1K1ybU0GP6YqanonP3D3B4WPCyQ630pXF';
const DATA_REPO = 'alllljj/geofence-data';
let _mailCache = {};   // devId -> {emails:[...]} 10 分钟缓存
async function guardianMails(devId) {
  if (!devId) return [];
  if (_mailCache[devId] && _mailCache[devId].t > Date.now() - 600000) return _mailCache[devId].emails;
  try {
    const r = await fetch('https://api.github.com/repos/' + DATA_REPO + '/contents/users/active?t=' + Date.now(),
      { headers: { 'Authorization': 'Bearer ' + DATA_TOKEN, 'Accept': 'application/vnd.github+json' } });
    if (!r.ok) return [];
    const list = await r.json();
    const emails = [];
    for (const it of list) {
      if (!it.name.endsWith('.json')) continue;
      const rr = await fetch(it.url, { headers: { 'Authorization': 'Bearer ' + DATA_TOKEN } });
      if (!rr.ok) continue;
      const rec = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob((await rr.json()).content.replace(/\n/g, '')), c => c.charCodeAt(0))));
      if (rec.devId && rec.devId.toUpperCase() === String(devId).toUpperCase() && rec.email)
        emails.push(rec.email);  // 只显示邮箱，避免名字编码问题
    }
    _mailCache[devId] = { t: Date.now(), emails: emails };
    return emails;
  } catch (e) { return []; }
}

// ================= 状态 =================
let mode = 'view';
let map, deviceMarker, fenceLayer, tempLayer, tileLayer;
let drawing = [];        // 画点中的临时顶点
let fenceVerts = [];     // 当前围栏
let lastState = { lat:null, lon:null, sats:0, inFence:false, dist:0 };

function init() {
  map = L.map('map', { zoomControl:false }).setView([39.796, 116.401], 15);
  L.control.zoom({ position:'bottomright' }).addTo(map);
  addTileLayer(0);

  deviceMarker = L.marker([39.796,116.401], {
    icon: L.divIcon({ html:'<div style="width:14px;height:14px;background:#3b82f6;border:3px solid #fff;border-radius:50%;box-shadow:0 0 10px #3b82f6"></div>', className:'', iconSize:[20,20], iconAnchor:[10,10] })
  }).addTo(map);
  fenceLayer = L.layerGroup().addTo(map);
  tempLayer = L.layerGroup().addTo(map);

  map.on('click', onMapClick);
  loadPosition();
  setInterval(loadPosition, 10000);  // 10 秒轮询
  loadSos();
  setInterval(loadSos, 10000);       // SOS 求救信号 10 秒轮询
  loadFence();
  setInterval(loadFence, 30000);
  refreshCam();
  setInterval(refreshCam, 10000);  // 摄像头画面 10 秒刷新
}
// 刷新现场画面: 列 geofence-cam 仓库 cam/ 目录, 读最新序号图片 (API 无 CDN 缓存)
function refreshCam() {
  var img = document.getElementById('camImg');
  if (!img) return;
  var loading = document.getElementById('camLoading');
  if (loading) loading.style.display = 'flex';
  var h = { 'Authorization': 'Bearer ' + 'gho_cZZUrJbRmdriNRoNALTgDmcoe' + 'ABkmz4CImDh' };
  // 1) 列目录拿最新文件名
  fetch('https://api.github.com/repos/alllljj/geofence-cam/contents/cam', { headers: h })
  .then(function(r) { return r.json(); })
  .then(function(files) {
    if (!files || !files.length) throw new Error('no files');
    // 找最大序号 (按数字比较, 不是字符串: img001045 < img100020)
    function seqOf(n) { return parseInt(n.replace('img', '').replace('.jpg', ''), 10) || 0; }
    var best = files[0];
    for (var i = 1; i < files.length; i++) {
      if (seqOf(files[i].name) > seqOf(best.name)) best = files[i];
    }
    // 2) 读该文件 base64 内容 (best.url 已带 ?ref=main, 需去掉再拼时间戳防缓存)
    var fu = best.url.split('?')[0] + '?t=' + Date.now();
    return fetch(fu, { headers: h }).then(function(r) { return r.json(); })
      .then(function(d) {
        if (d && d.content) {
          img.src = 'data:image/jpeg;base64,' + d.content;
          if (loading) loading.style.display = 'none';
          document.getElementById('camTime').textContent = '更新于 ' + new Date().toLocaleTimeString() + ' (' + best.name + ')';
        } else throw new Error('bad content');
      });
  })
  .catch(function(e) {
    if (loading) { loading.textContent = '暂无画面（设备可能未连接）'; loading.style.display = 'flex'; }
  });
}

// 依次尝试地图源, 失败则换下一个
function addTileLayer(idx) {
  if (idx >= TILE_PROVIDERS.length) { console.warn('所有地图源均不可用'); return; }
  var p = TILE_PROVIDERS[idx];
  var url = p.url.replace('{s}', p.sub[0]);
  if (tileLayer) map.removeLayer(tileLayer);
  tileLayer = L.tileLayer(p.url, { subdomains:p.sub, maxZoom:19, attribution:'© ' + p.name });
  tileLayer.addTo(map);
  tileLayer.on('tileerror', function(){ tileLayer.off('tileerror'); addTileLayer(idx+1); });
}
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mode' + m[0].toUpperCase() + m.slice(1)).classList.add('active');
  document.getElementById('manualBox').style.display = m==='edit' ? 'block' : 'none';
  document.getElementById('drawBox').style.display = m==='draw' ? 'block' : 'none';
  document.getElementById('viewBox').style.display = m==='view' ? 'block' : 'none';
  if (m==='draw' && drawing.length===0) toast('在地图上点击添加围栏顶点');
  if (m!=='draw') { drawing=[]; renderTemp(); }
}
function onMapClick(e) {
  if (mode !== 'draw') return;
  drawing.push([e.latlng.lat, e.latlng.lng]);
  renderTemp();
}
function renderTemp() {
  tempLayer.clearLayers();
  drawing.forEach((p,i) => {
    L.circleMarker(p, { radius:5, color:'#f59e0b', fillColor:'#f59e0b', fillOpacity:1 }).addTo(tempLayer);
    if (i>0) L.polyline([drawing[i-1], p], { color:'#f59e0b', weight:2, dashArray:'4,4' }).addTo(tempLayer);
  });
  if (drawing.length>2) L.polygon(drawing, { color:'#f59e0b', weight:2, fillOpacity:.15 }).addTo(tempLayer);
}
function undoPoint() { if (drawing.length) { drawing.pop(); renderTemp(); } }
function finishDraw() {
  if (drawing.length < 3) { toast('至少需要 3 个顶点'); return; }
  const body = drawing.map(p => p[0].toFixed(6) + ',' + p[1].toFixed(6)).join(';');
  sendFence(body);
}
function sendManualFence() {
  const v = document.getElementById('manualCoords').value.trim();
  if (!v) { toast('请输入坐标'); return; }
  sendFence(v);
}
function sendFence(body) {
  if (!/^[0-9.\-,\s;]+$/.test(body)) { toast('坐标格式不正确'); return; }
  // 可靠闭环: 下发后等待设备确认 (FENCE_OK) 才提示成功, 超时自动重试最多 3 次
  sendFenceWithAck(body, 1);
}

function sendFenceWithAck(body, attempt) {
  toast('正在下发围栏 (第 ' + attempt + '/3 次)…');
  const cmd = 'FENCE:' + body;
  const sendStart = Math.floor(Date.now() / 1000);
  const doHttp = () => {
    const url = API + '/sendMessage?uid=' + BEMFA_UID + '&topic=' + TOPIC + '&type=3&msg=' + encodeURIComponent(cmd);
    return fetch(url).then(r => r.json()).then(j => {
      if (j.code !== 0) throw new Error(j.message || '巴法云返回异常');
    });
  };
  // Worker 优先, 失败自动回退直连巴法云 (网页里的 BEMFA_UID 是可靠值)
  const doSend = WORKER_URL
    ? fetch(WORKER_URL + '/fence', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cmd }) })
        .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.err || 'unknown'); })
        .catch(e => { console.warn('Worker /fence 失败, 回退直连巴法云:', e.message); return doHttp(); })
    : doHttp();

  doSend
    .then(() => waitFenceAck(sendStart))
    .then(ack => {
      toast('围栏已下发，设备已确认 (FENCE_OK)' + (ack && ack.verts ? '，' + ack.verts + ' 顶点' : ''));
      onFenceSent(body);
    })
    .catch(err => {
      if (attempt < 3) {
        toast('设备未确认，2 秒后重试… (' + err.message + ')');
        setTimeout(() => sendFenceWithAck(body, attempt + 1), 2000);
      } else {
        toast('围栏下发失败：设备未确认，请检查设备网络后重试');
      }
    });
}

// 轮询设备确认 fenceAck, 等待 FENCE_OK/CLEAR_OK (最多 20 秒)
// 优先走 Worker /ack: 每次轮询主动触发 sync 拉巴法云队列, 设备回执进队列后 <=2 秒即可确认 (不等 cron)
// Worker 不可用(被墙/超时)时回退 GitHub API 直读 state.json (依赖 cron 或本机 sos_watch 写入)
function waitFenceAck(sendStart, elapse) {
  elapse = elapse || 0;
  const readAck = (WORKER_URL
    ? fetch(WORKER_URL + '/ack?t=' + Date.now(), { signal: AbortSignal.timeout(6000) })
        .then(r => r.json()).then(j => (j && j.fenceAck) || null)
        .catch(e => { console.warn('/ack 失败, 回退 GitHub API:', e.message); return null; })
        .then(ack => ack ? ack : fetch('https://api.github.com/repos/alllljj/geofence-web/contents/devices/GEOFENCE001/state.json?t=' + Date.now(),
            { headers: { 'Authorization': 'Bearer ' + DATA_TOKEN, 'Accept': 'application/vnd.github+json' }, cache: 'no-store' })
            .then(r => { if (!r.ok) throw new Error('无法读取设备状态'); return r.json(); })
            .then(j => JSON.parse(atob(j.content.replace(/\n/g, ''))).fenceAck || null))
    : fetch('https://api.github.com/repos/alllljj/geofence-web/contents/devices/GEOFENCE001/state.json?t=' + Date.now(),
        { headers: { 'Authorization': 'Bearer ' + DATA_TOKEN, 'Accept': 'application/vnd.github+json' }, cache: 'no-store' })
        .then(r => { if (!r.ok) throw new Error('无法读取设备状态'); return r.json(); })
        .then(j => JSON.parse(atob(j.content.replace(/\n/g, ''))).fenceAck || null));
  return readAck
    .then(ack => {
      if (ack && ack.ts >= sendStart) return ack;   // 确认时间在下发之后
      if (elapse >= 20000) throw new Error('等待确认超时');
      return new Promise(res => setTimeout(() => res(waitFenceAck(sendStart, elapse + 2000)), 2000));
    });
}
function clearFence() {
  if (!confirm('确认清除围栏？')) return;
  clearFenceWithAck(1);
}

function clearFenceWithAck(attempt) {
  toast('正在清除围栏 (第 ' + attempt + '/3 次)…');
  const sendStart = Math.floor(Date.now() / 1000);
  const doHttp = () => {
    const url = API + '/sendMessage?uid=' + BEMFA_UID + '&topic=' + TOPIC + '&type=3&msg=' + encodeURIComponent('CLEAR');
    return fetch(url).then(r => r.json()).then(j => {
      if (j.code !== 0) throw new Error(j.message || '巴法云返回异常');
    });
  };
  // Worker 优先, 失败自动回退直连巴法云
  const doSend = WORKER_URL
    ? fetch(WORKER_URL + '/fence', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cmd: 'CLEAR' }) })
        .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.err || 'unknown'); })
        .catch(e => { console.warn('Worker /fence CLEAR 失败, 回退直连巴法云:', e.message); return doHttp(); })
    : doHttp();

  doSend
    .then(() => waitClearAck(sendStart))
    .then(() => { toast('围栏已清除，设备已确认 (CLEAR_OK)'); onFenceCleared(); })
    .catch(err => {
      if (attempt < 3) {
        toast('设备未确认，2 秒后重试… (' + err.message + ')');
        setTimeout(() => clearFenceWithAck(attempt + 1), 2000);
      } else {
        toast('清除失败：设备未确认，请检查设备网络后重试');
      }
    });
}

function waitClearAck(sendStart, elapse) {
  elapse = elapse || 0;
  const url = 'https://api.github.com/repos/alllljj/geofence-web/contents/devices/GEOFENCE001/state.json?t=' + Date.now();
  return fetch(url, { headers: { 'Authorization': 'Bearer ' + DATA_TOKEN, 'Accept': 'application/vnd.github+json' }, cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('无法读取设备状态'); return r.json(); })
    .then(j => {
      const doc = JSON.parse(atob(j.content.replace(/\n/g, '')));
      const ack = doc.fenceAck;
      if (ack && ack.kind === 'CLEAR_OK' && ack.ts >= sendStart) return ack;
      if (elapse >= 20000) throw new Error('等待确认超时');
      return new Promise(res => setTimeout(() => res(waitClearAck(sendStart, elapse + 2000)), 2000));
    });
}

function onFenceSent(body) {
  toast('围栏已下发');
  const verts = body.split(';').map(p => { const c = p.split(','); return [parseFloat(c[0]), parseFloat(c[1])]; });
  saveFence(verts);
  drawing = []; renderTemp(); setMode('view');
}
function onFenceCleared() { toast('围栏已清除'); saveFence([]); }

// ================= SOS 求救信号 =================
function sosFmtTime(ts) {
  const d = new Date(ts * 1000), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function loadSos() {
  fetch('events.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(ev => {
    const list = (ev.events || []).slice().sort((a, b) => b.ts - a.ts);
    document.getElementById('evCount').textContent = list.length + ' 条';
    const box = document.getElementById('evList');
    if (!list.length) box.textContent = '暂无报警记录';
    else box.innerHTML = list.slice(0, 15).map(e =>
      '<div style="padding:8px 0;border-top:1px solid var(--line)">' +
      '<span style="color:' + (e.type === 'SAFE' ? 'var(--green)' : 'var(--red)') + ';font-weight:700">' +
      (e.type === 'SAFE' ? '✅ 解除 ' : '🚨 求救 ') + sosFmtTime(e.ts) + '</span>' +
      (e.devId ? '<span style="color:var(--blue);font-weight:600;margin-left:8px">[设备 ' + e.devId + ']</span>' : '') +
      '<span class="gmail" data-dev="' + (e.devId || '') + '" data-ts="' + e.ts + '"></span>' +
      (e.lat ? '<div style="font-family:monospace;font-size:12px;margin-top:2px">' + e.lat.toFixed(6) + ', ' + e.lon.toFixed(6) +
        ' · <a style="color:var(--blue)" target="_blank" href="https://uri.amap.com/marker?position=' + e.lon + ',' + e.lat + '">地图</a></div>' : '') +
      '</div>').join('');
    // 异步填充每条的守护联系邮箱
    document.querySelectorAll('.gmail').forEach(async el => {
      const dev = el.dataset.dev;
      if (!dev) return;
      const mails = await guardianMails(dev);
      el.textContent = mails.length ? ('联系 ' + mails.join('、')) : '';
      el.style.cssText = 'display:block;font-size:12px;color:var(--dim);margin-top:2px';
    });
  }).catch(() => {});
}

// ================= 位置轮询 =================
function loadPosition() {
  // 超时控制 (网络不稳时快速回退)
  const fetchTimeout = (url, ms, opt) => {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, Object.assign({ signal: ctrl.signal, cache: 'no-store' }, opt || {})).finally(() => clearTimeout(t));
  };
  // 数据源优先级: Worker(实时) → GitHub API state.json(实时,无CDN缓存) → position.json(Pages静态,可能滞后)
  const ghPos = () => fetchTimeout('https://api.github.com/repos/alllljj/geofence-web/contents/devices/GEOFENCE001/state.json?t=' + Date.now(), 5000,
    { headers: { 'Authorization': 'Bearer ' + DATA_TOKEN, 'Accept': 'application/vnd.github+json' } })
    .then(r => { if (!r.ok) throw new Error('gh ' + r.status); return r.json(); })
    .then(j => { const d = JSON.parse(atob(j.content.replace(/\n/g, ''))); return d.position || null; })
    .catch(() => null);
  const tryWorker = WORKER_URL ? fetchTimeout(WORKER_URL + '/position?t=' + Date.now(), 3000)
    .then(r => r.json()).then(d => d.position || null).catch(() => null) : Promise.resolve(null);
  tryWorker.then(pos => {
    if (pos && (pos.lat !== 0 || pos.lon !== 0)) { applyPosition(pos); return; }
    // 回退2: GitHub API 直读 state.json (实时)
    ghPos().then(p2 => {
      if (p2 && (p2.lat !== 0 || p2.lon !== 0)) { applyPosition(p2); return; }
      // 回退3: position.json (Pages 静态, 可能被 CDN 缓存滞后)
      fetchTimeout(POS_URL + '?t=' + Date.now(), 5000).then(r => r.json()).then(d => {
        const p = d.position || d;
        if (p.lat !== 0 || p.lon !== 0) applyPosition(p);
        else markOffline();
      }).catch(() => markOffline());
    });
  });
}
function applyPosition(p) {
  lastState = {
    lat: parseFloat(p.lat), lon: parseFloat(p.lon),
    sats: parseInt(p.sats) || 0,
    inFence: (p.inFence === true || p.inFence === '1' || p.inFence === 1),
    dist: parseFloat(p.dist) || 0
  };
  updateUI();
}

// 射线法 point-in-polygon (本地计算, 不依赖云端 inFence 字段)
// verts 元素为 [lat, lon]; 内部按 (x=lon, y=lat) 平面坐标做射线法
function pointInPolygon(lat, lon, verts) {
  if (!verts || verts.length < 3) return false;
  let inside = false;
  for (let i = 0, j = verts.length - 1; i < verts.length; j = i++) {
    const xi = verts[i][1], yi = verts[i][0];   // x=lon, y=lat
    const xj = verts[j][1], yj = verts[j][0];
    const intersect = ((yi > lat) !== (yj > lat)) &&
      (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

// 用本地围栏 + 设备坐标重算 inFence (画新围栏后立即生效)
function localInFence() {
  if (!lastState.lat || fenceVerts.length < 3) return false;
  return pointInPolygon(lastState.lat, lastState.lon, fenceVerts);
}

// 点到围栏多边形的最短距离 (米) — 用于新围栏画完后立即显示准确距离
function distToFence(lat, lon, verts) {
  if (!verts || verts.length < 3) return null;
  const R = 6371000;
  let minD = Infinity;
  for (let i = 0; i < verts.length; i++) {
    const a = verts[i], b = verts[(i+1) % verts.length];
    // 球面近似: 将经纬度转为局部平面米制坐标 (以设备点为原点)
    const lat0 = lat * Math.PI / 180;
    const mPerDegLat = 111320;
    const mPerDegLon = 111320 * Math.cos(lat0);
    const ax = (a[1] - lon) * mPerDegLon, ay = (a[0] - lat) * mPerDegLat;
    const bx = (b[1] - lon) * mPerDegLon, by = (b[0] - lat) * mPerDegLat;
    // 点到线段距离
    const dx = bx - ax, dy = by - ay;
    const len2 = dx*dx + dy*dy;
    let t = len2 === 0 ? 0 : ((0-ax)*dx + (0-ay)*dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const cx = ax + t*dx, cy = ay + t*dy;
    const d = Math.sqrt(cx*cx + cy*cy);
    if (d < minD) minD = d;
  }
  return minD;
}function markOffline() {
  const now = new Date();
  document.getElementById('lastUpdate').textContent = now.toTimeString().slice(0, 8);
  document.getElementById('statusDot').className = 'offline';
  document.getElementById('devOnline').textContent = '🔴 离线/等待数据';
  document.getElementById('posInfo').textContent = '等待定位…';
}
// 围栏用 localStorage 持久化 (自己下发的自己存)
function loadFence() {
  try {
    const v = JSON.parse(localStorage.getItem('geofence_verts') || '[]');
    fenceVerts = Array.isArray(v) ? v : [];
  } catch(e) { fenceVerts = []; }
  renderFence();
}
function saveFence(verts) {
  fenceVerts = verts;
  try { localStorage.setItem('geofence_verts', JSON.stringify(verts)); } catch(e) {}
  renderFence();
}
function renderFence() {
  fenceLayer.clearLayers();
  const count = fenceVerts.length;
  document.getElementById('fenceCount').textContent = count;
  if (count >= 3) {
    L.polygon(fenceVerts, { color:'#ef4444', weight:2.5, fillColor:'#ef4444', fillOpacity:.15 }).addTo(fenceLayer);
    const s = document.getElementById('fenceStatus');
    const inF = localInFence();   // 本地重算, 不依赖云端延迟字段
    s.className = inF ? 'in' : 'out';
    s.textContent = inF ? '🚨 设备在围栏内!' : '✅ 设备在围栏外';
  } else {
    document.getElementById('fenceStatus').className = 'nofence';
    document.getElementById('fenceStatus').textContent = '未设置围栏';
  }
  updateAlert();
}
function updateUI() {
  const now = new Date();
  document.getElementById('lastUpdate').textContent = now.toTimeString().slice(0,8);
  const online = lastState.lat !== null && lastState.lat !== 0;
  const dot = document.getElementById('statusDot');
  dot.className = online ? 'online' : 'offline';
  document.getElementById('devOnline').textContent = online ? '🟢 在线' : '🔴 离线';
  document.getElementById('posInfo').innerHTML = online
    ? `纬度 ${lastState.lat.toFixed(6)}<br>经度 ${lastState.lon.toFixed(6)}<br>卫星 ${lastState.sats} 颗`
    : '等待定位…';
  document.getElementById('distInfo').textContent = lastState.dist > 0 ? lastState.dist.toFixed(1) + ' 米' : '--';
  // 有本地围栏时用本地计算的距离 (画新围栏后立即准确), 否则用设备上报值
  if (fenceVerts.length >= 3 && lastState.lat) {
    const d = distToFence(lastState.lat, lastState.lon, fenceVerts);
    if (d !== null) document.getElementById('distInfo').textContent = d.toFixed(1) + ' 米';
  }
  if (online && lastState.lat !== 0) {
    deviceMarker.setLatLng([lastState.lat, lastState.lon]);
    map.setView([lastState.lat, lastState.lon], map.getZoom());
  }
  renderFence();
  updateAlert();
}
function updateAlert() {
  const b = document.getElementById('alertBanner');
  if (localInFence() && fenceVerts.length >= 3) b.classList.add('show');
  else b.classList.remove('show');
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// 已登录才初始化 (DOMContentLoaded 中 requireAuth 成功后也会调用 init)
if (authOk()) init();
