name: Sync device position

on:
  schedule:
    - cron: '*/2 * * * *'   # 每 2 分钟拉取一次设备坐标
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest device position from Bemfa
        env:
          BEMFA_UID: ${{ secrets.BEMFA_UID }}
          TOPIC: ${{ secrets.BEMFA_TOPIC }}
        run: |
          python3 - <<'EOF'
          import socket, json, os, time, re

          UID = os.environ.get('BEMFA_UID', '')
          TOPIC = os.environ.get('BEMFA_TOPIC', 'geofence001')
          out = {"position": {"lat": 0, "lon": 0, "sats": 0, "inFence": False, "dist": 0, "ts": 0}}

          def pull_with_wait(total_s):
              """cmd=3 订阅后持续接收 total_s 秒, 返回收集到的全部文本"""
              try:
                  s = socket.create_connection(('bemfa.com', 8344), timeout=10)
                  s.settimeout(total_s)
                  s.sendall(('cmd=3&uid=%s&topic=%s\r\n' % (UID, TOPIC)).encode())
                  buf = b''
                  t0 = time.time()
                  try:
                      while time.time() - t0 < total_s:
                          chunk = s.recv(4096)
                          if not chunk: break
                          buf += chunk
                  except socket.timeout:
                      pass
                  s.close()
                  return buf.decode('utf-8', errors='replace')
              except Exception as e:
                  return 'ERR:' + str(e)

          # cmd=3 后持续听 32 秒, 覆盖设备一个完整 30s 坐标上报周期
          txt = pull_with_wait(32)
          print("raw tail:", txt[-200:])

          # 取最后一条坐标 (msg=后是 5 个逗号分隔数字: lat,lon,sats,inFence,dist)
          coords = re.findall(r'msg=(-?[\d.]+),(-?[\d.]+),(\d+),(\d+),(-?[\d.]+)', txt)
          if coords:
              lat, lon = float(coords[-1][0]), float(coords[-1][1])
              if abs(lat) > 0.0001 or abs(lon) > 0.0001:
                  out["position"] = {
                      "lat": lat, "lon": lon,
                      "sats": int(coords[-1][2]),
                      "inFence": coords[-1][3] == "1",
                      "dist": float(coords[-1][4]),
                      "ts": int(time.time())
                  }
                  print("OK lat=%.6f lon=%.6f sats=%s inFence=%s dist=%s" % tuple([lat, lon] + list(coords[-1][2:])))
              else:
                  print("WARN coord all zero")
          else:
              print("WARN no coords in stream")

          # 保底: 抓不到新坐标时保留上次的 position.json (不清零)
          if out["position"]["lat"] == 0 and out["position"]["lon"] == 0:
              try:
                  import json as _j
                  old = _j.load(open('position.json', encoding='utf-8'))
                  oldp = old.get('position', {})
                  if oldp.get('lat') != 0 or oldp.get('lon') != 0:
                      oldp['ts'] = oldp.get('ts', 0)
                      out = old
                      print("KEEP old position (lat=%.6f lon=%.6f)" % (oldp['lat'], oldp['lon']))
              except Exception as e:
                  print("KEEP failed:", e)

          with open('position.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False)
          EOF

      - name: Commit and push
        run: |
          git config user.name "geofence-bot"
          git config user.email "geofence-bot@users.noreply.github.com"
          git add position.json
          git diff --cached --quiet && echo "no change" || {
            git commit -m "sync position $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          }
