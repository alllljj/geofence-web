name: Sync device position

on:
  schedule:
    - cron: '*/2 * * * *'   # 每 2 分钟拉取一次设备坐标（GitHub 实际调度可能延迟数分钟）
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      sos: ${{ steps.pull.outputs.sos }}
      lat: ${{ steps.pull.outputs.lat }}
      lon: ${{ steps.pull.outputs.lon }}
      ts:  ${{ steps.pull.outputs.ts }}
      devid: ${{ steps.pull.outputs.devid }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest device position from Bemfa
        id: pull
        env:
          BEMFA_UID: ${{ secrets.BEMFA_UID }}
          DEVID: ${{ secrets.BEMFA_TOPIC }}
          TOPIC: ${{ secrets.BEMFA_TOPIC }}
        run: |
          python3 - <<'EOF'
          import socket, json, os, time, re

          UID = os.environ.get('BEMFA_UID', '')
          TOPIC = os.environ.get('BEMFA_TOPIC', 'geofence001')
          DEVID = os.environ.get('DEVID', TOPIC).strip().upper() or 'GEOFENCE001'
          os.makedirs('devices/' + DEVID, exist_ok=True)
          out = {"position": {"lat": 0, "lon": 0, "sats": 0, "inFence": False, "dist": 0, "ts": 0, "sos": False}}

          def pull_with_wait(total_s):
              """cmd=3 订阅后持续接收 total_s 秒, 返回收集到的全部文本"""
              try:
                  s = socket.create_connection(('bemfa.com', 8344), timeout=10)
                  s.settimeout(total_s)
                  s.sendall(('cmd=3&uid=%s&topic=%s\r\n' % (UID, TOPIC)).encode())
                  buf = b''
                  t0 = time.time()
                  try:
                      while time.time() - t0 < total_s:
                          chunk = s.recv(4096)
                          if not chunk: break
                          buf += chunk
                  except socket.timeout:
                      pass
                  s.close()
                  return buf.decode('utf-8', errors='replace')
              except Exception as e:
                  return 'ERR:' + str(e)

          # cmd=3 后持续听 32 秒, 覆盖设备一个完整 30s 坐标上报周期
          txt = pull_with_wait(32)
          print("raw tail:", txt[-300:])
          now = int(time.time())

          # ---------- 1) 普通坐标上报 ----------
          coords = re.findall(r'msg=(-?[\d.]+),(-?[\d.]+),(\d+),(\d+),(-?[\d.]+)', txt)
          if coords:
              lat, lon = float(coords[-1][0]), float(coords[-1][1])
              if abs(lat) > 0.0001 or abs(lon) > 0.0001:
                  out["position"] = {
                      "lat": lat, "lon": lon,
                      "sats": int(coords[-1][2]),
                      "inFence": coords[-1][3] == "1",
                      "dist": float(coords[-1][4]),
                      "ts": now, "sos": False
                  }
                  print("OK lat=%.6f lon=%.6f sats=%s inFence=%s dist=%s" % tuple([lat, lon] + list(coords[-1][2:])))
              else:
                  print("WARN coord all zero")
          else:
              print("WARN no coords in stream")

          # ---------- 2) SOS / SAFE 求救信号 ----------
          sos_hits = re.findall(r'msg=SOS:(-?[\d.]+),(-?[\d.]+)', txt)
          safe_hit = 'msg=SAFE' in txt
          sos_lat = sos_lon = 0.0
          fire = False

          # 载入历史事件
          try:
              ev = json.load(open('events.json', encoding='utf-8'))
          except Exception:
              ev = {"sos": False, "updated": 0, "events": []}
          evs = ev.get('events', [])
          last_sos_ts = max([e['ts'] for e in evs if e.get('type') == 'SOS'] or [0])

          if sos_hits:
              sos_lat, sos_lon = float(sos_hits[-1][0]), float(sos_hits[-1][1])
              # 去重: 5 分钟内已记录过同一次求救(可能已被电脑端 sos_watch 记录)则不重复发信
              if now - last_sos_ts > 300:
                  evs.append({"ts": now, "type": "SOS", "lat": sos_lat, "lon": sos_lon, "src": "actions"})
                  fire = True
                  print("SOS detected! lat=%.6f lon=%.6f -> 触发报警邮件" % (sos_lat, sos_lon))
              else:
                  print("SOS detected but deduped (last=%d, now=%d)" % (last_sos_ts, now))
              ev['sos'] = True
              out['position']['sos'] = True
          elif safe_hit and ev.get('sos'):
              evs.append({"ts": now, "type": "SAFE", "lat": 0, "lon": 0, "src": "actions"})
              ev['sos'] = False
              print("SAFE received -> 解除报警状态")

          ev['events'] = evs[-100:]
          ev['updated'] = now
          with open('devices/%s/state.json' % DEVID, 'w', encoding='utf-8') as f:
              json.dump(ev, f, ensure_ascii=False)

          # ---------- 3) 保底: 抓不到新坐标时保留上次的 position.json ----------
          if out["position"]["lat"] == 0 and out["position"]["lon"] == 0:
              try:
                  old = json.load(open('position.json', encoding='utf-8'))
                  oldp = old.get('position', {})
                  if oldp.get('lat') != 0 or oldp.get('lon') != 0:
                      oldp['sos'] = out['position']['sos']
                      out = {"position": oldp}
                      print("KEEP old position (lat=%.6f lon=%.6f)" % (oldp['lat'], oldp['lon']))
              except Exception as e:
                  print("KEEP failed:", e)

          # 合并历史 events: 保留之前电脑端 sos_watch 写入的事件记录
          try:
              old_state = json.load(open('devices/%s/state.json', encoding='utf-8'))
              if old_state.get('events'):
                  out['events'] = old_state['events']
              out['updated'] = old_state.get('updated', now)
          except Exception:
              pass
          with open('devices/%s/state.json' % DEVID, 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False)

          # ---------- 4) 输出给下一个 job ----------
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("sos=%s\n" % ("1" if fire else "0"))
              f.write("lat=%.6f\n" % sos_lat)
              f.write("lon=%.6f\n" % sos_lon)
              f.write("ts=%d\n" % now)
              f.write("devid=%s\n" % DEVID)
          EOF

      - name: Commit and push
        run: |
          git config user.name "geofence-bot"
          git config user.email "geofence-bot@users.noreply.github.com"
          git add devices/
          git diff --cached --quiet && echo "no change" || {
            git commit -m "sync position $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase --autostash || true
            git push
          }

  # 检测到求救信号 -> 通知 geofence-data 仓库群发报警邮件
  notify:
    needs: sync
    if: needs.sync.outputs.sos == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch sos-alert to geofence-data
        env:
          DATA_PAT: ${{ secrets.DATA_PAT }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $DATA_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/alllljj/geofence-data/dispatches \
            -d '{"event_type":"sos-alert","client_payload":{"lat":${{ needs.sync.outputs.lat }},"lon":${{ needs.sync.outputs.lon }},"ts":${{ needs.sync.outputs.ts }},"devId":"${{ needs.sync.outputs.devid }}"}}'
          echo "dispatched"
